[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/runtime",
    "crates/editor",
    "crates/agent-pi",
    "crates/lsp",
    "crates/panels/file_tree",
    "crates/panels/agent_chat",
    "crates/panels/language_servers",
    "crates/panels/problems",
    "crates/panels/pi_settings",
    "crates/panels/search",
    "crates/panels/preview",
    "crates/panels/pdf",
    "crates/panels/run",
    "crates/panels/git",
    "crates/panels/structure",
    "crates/panels/scripts",
    "spike",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false
version = "0.1.0"

[workspace.dependencies]
# GPUI only through gpui-kit, never a direct `gpui`/`gpui-pre` dependency (spec, Tech stack).
# Features live here so every crate sees one unified set.
gpui-kit = { version = "=0.10.0", features = [
    "profiler",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-html",
    "tree-sitter-css",
] }

pide-core = { path = "crates/core" }
pide-runtime = { path = "crates/runtime" }
pide-editor = { path = "crates/editor" }
pide-agent-pi = { path = "crates/agent-pi" }
pide-lsp = { path = "crates/lsp" }
pide-file-tree = { path = "crates/panels/file_tree" }
pide-agent-chat = { path = "crates/panels/agent_chat" }
pide-language-servers = { path = "crates/panels/language_servers" }
pide-problems = { path = "crates/panels/problems" }
pide-pi-settings = { path = "crates/panels/pi_settings" }
pide-search = { path = "crates/panels/search" }
pide-run = { path = "crates/panels/run" }
pide-git = { path = "crates/panels/git" }
pide-structure = { path = "crates/panels/structure" }
pide-scripts = { path = "crates/panels/scripts" }
pide-preview = { path = "crates/panels/preview" }
pide-pdf = { path = "crates/panels/pdf" }

anyhow = "1.0.104"
# Script panels (crates/panels/scripts): JavaScript tool windows on QuickJS, drawn as GPUI elements.
# No `webview` (it pulls wry and gpui-fast, which would switch GPUI Kit to another GPUI build).
gpui-shell = { version = "=0.10.0", default-features = false, features = ["quickjs", "components"] }
futures = "0.3"
env_logger = "0.11.11"
ignore = "0.4.34"
log = "0.4.35"
# Exactly GPUI Kit's version and features, so its provider traits and ours share the types.
lsp-types = { version = "=0.97.0", features = ["proposed"] }
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
# Math in markdown (core/src/math.rs): RaTeX, a pure-Rust KaTeX port, rasterised with its
# embedded KaTeX fonts. Not ratex-gpui: that one depends on gpui-pre directly.
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
# LaTeX highlighting: GPUI Kit has no LaTeX grammar (editor/src/latex.rs). tree-sitter must
# stay the version GPUI Kit uses (its Language type is shared).
tree-sitter = "0.26"
codebook-tree-sitter-latex = "0.6.1"
# Typst highlighting, same arrangement (editor/src/typst.rs).
codebook-tree-sitter-typst = "0.12.1"
base64 = "0.22.1"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }

# Dependencies optimised even in debug builds, so dev builds scroll and type like release;
# our own crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: it was most of target/debug (tens of GB on the Mac).
# pide's own crates keep full debug info.
debug = false

[profile.release]
debug = "line-tables-only"
