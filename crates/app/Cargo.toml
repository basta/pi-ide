[package]
name = "pide"
description = "pide: a personal native code editor with the pi coding agent built in."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pide"
path = "src/main.rs"

[features]
# Driving pide from the background for testing (dev/pidectl): a local socket
# that runs commands, sends keys and clicks, and renders the window to an image
# even while it's hidden. Never in a normal build.
devctl = ["gpui-kit/test-support"]

[dependencies]
gpui-kit.workspace = true
pide-core.workspace = true
pide-lsp.workspace = true
pide-runtime.workspace = true
pide-editor.workspace = true
pide-agent-pi.workspace = true
pide-file-tree.workspace = true
pide-agent-chat.workspace = true
pide-language-servers.workspace = true
pide-problems.workspace = true
pide-structure.workspace = true
pide-cmake.workspace = true
pide-pi-settings.workspace = true
pide-search.workspace = true
pide-run.workspace = true
pide-terminal.workspace = true
pide-git.workspace = true
pide-preview.workspace = true
pide-pdf.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
nucleo-matcher.workspace = true
ignore.workspace = true
serde_json.workspace = true
lsp-types.workspace = true
