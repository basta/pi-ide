[package]
name = "pide-pdf"
description = "PDF panel: pdfium rendering on a worker thread, zoom, text search, bounded page cache."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
pide-core.workspace = true
pide-runtime.workspace = true
anyhow.workspace = true
tokio = { workspace = true }
log.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "image_latest", "thread_safe"] }
